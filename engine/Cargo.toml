[package]
name = "mwi-fastsim"
version = "0.1.0"
edition = "2021"

[lib]
name = "mwi_engine"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "mwi-fastsim"
path = "src/main.rs"
doc = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
indexmap = "2"
rustc-hash = "2"
smallvec = "1"
libm = "0.2"

[features]
prof = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "unwind"

# browser build: cargo build --profile wasm --target wasm32-unknown-unknown --lib
[profile.wasm]
inherits = "release"
panic = "abort"
